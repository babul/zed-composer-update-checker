name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Test the language server
        run: cargo test -p composer-update-checker-lsp
      - name: Check the extension compiles to WASM
        run: cargo build --target wasm32-wasip1
